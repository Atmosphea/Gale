/* PWA service-worker registration (offline caching + fast relaunch). Best-effort; no-op if unsupported.

(function(){ try { if ('serviceWorker' in navigator) { window.addEventListener('load', function(){
  navigator.serviceWorker.register('sw.js').then(function(reg){ try { reg.update(); } catch(e){} }).catch(function(){});
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloaded) return; reloaded = true;
    if (navigator.serviceWorker.controller) location.reload();
  });
}); } } catch(e){} })();
</script>
<script>

        circBtn('\u223F', 'Haptics', this.state.hapticsOn, () => { this.playSound('modeSwitch'); this.setState(s => ({ hapticsOn: !s.hapticsOn }), () => { this.saveSettings(); if (this.state.hapticsOn) this.hapticChapter(); }); }),
        circBtn(motionIcons[this.state.hlMotionIdx] || '\u2022', motionNames[this.state.hlMotionIdx] || 'Fade', false, () => this.cycleMotion()),
        circBtn('\u25CE', 'Manual', this.state.manual, () => { this.playSound('modeSwitch'); this.setState(s => ({ manual: !s.manual, playing: false })); clearTimeout(this.readTimer); }),
        circBtn('\u26F0', 'Travel', this.state.travelOn, () => this.toggleTravel())
      )
    );
  }

  /* ===================== PRESETS ===================== */
  snapshot() { return { speed: this.state.speed, lpm: this.state.lpm, emphasis: this.state.emphasis, fontIdx: this.state.fontIdx, mode: this.state.mode, discoverySize: this.state.discoverySize, easeMode: this.state.easeMode, textScale: this.state.textScale, wordsBefore: this.state.wordsBefore, wordsAfter: this.state.wordsAfter, textLight: this.state.textLight, hlStyleIdx: this.state.hlStyleIdx, hlMotionIdx: this.state.hlMotionIdx, leadStream: this.state.leadStream, hl: Object.assign({}, this.state.hl),
    marginPct: this.state.marginPct, dyslexicMode: this.state.dyslexicMode, hapticsOn: this.state.hapticsOn, autoskipOn: this.state.autoskipOn, shiftingOn: this.state.shiftingOn, poppleOn: this.state.poppleOn, showPageOn: this.state.showPageOn, pauseQOn: this.state.pauseQOn, travelOn: this.state.travelOn, manual: this.state.manual, remindMinutes: this.state.remindMinutes, soundOn: this.state.soundOn }; }
  savePreset(i) { const presets = this.state.presets.slice(); presets[i] = this.snapshot(); try { localStorage.setItem('rv_presets', JSON.stringify(presets)); } catch (e) {} this.setState({ presets, activePreset: i }); this.playSound('modeSwitch'); }
  deletePreset(i) { const presets = this.state.presets.slice(); presets[i] = null; try { localStorage.setItem('rv_presets', JSON.stringify(presets)); } catch (e) {} this.setState({ presets, activePreset: null }); this.playSound('modeSwitch'); }
  loadPreset(i) {
    const p = this.state.presets[i]; if (!p) return; clearTimeout(this.readTimer); this.playSound('open');
    this.setState({ speed: p.speed, lpm: p.lpm != null ? p.lpm : this.state.lpm, emphasis: p.emphasis, fontIdx: p.fontIdx, mode: p.mode, discoverySize: p.discoverySize, textScale: p.textScale != null ? p.textScale : this.state.textScale, easeMode: p.easeMode != null ? p.easeMode : this.state.easeMode, wordsBefore: p.wordsBefore != null ? p.wordsBefore : this.state.wordsBefore, wordsAfter: p.wordsAfter != null ? p.wordsAfter : this.state.wordsAfter, textLight: p.textLight != null ? p.textLight : this.state.textLight, hlStyleIdx: p.hlStyleIdx != null ? p.hlStyleIdx : this.state.hlStyleIdx, hlMotionIdx: p.hlMotionIdx != null ? p.hlMotionIdx : this.state.hlMotionIdx, leadStream: !!p.leadStream, hl: Object.assign({}, p.hl),
      marginPct: p.marginPct != null ? p.marginPct : this.state.marginPct, dyslexicMode: p.dyslexicMode != null ? p.dyslexicMode : this.state.dyslexicMode, hapticsOn: p.hapticsOn != null ? p.hapticsOn : this.state.hapticsOn, autoskipOn: p.autoskipOn != null ? p.autoskipOn : this.state.autoskipOn, shiftingOn: p.shiftingOn != null ? p.shiftingOn : this.state.shiftingOn, poppleOn: p.poppleOn != null ? p.poppleOn : this.state.poppleOn, showPageOn: p.showPageOn != null ? p.showPageOn : this.state.showPageOn, pauseQOn: p.pauseQOn != null ? p.pauseQOn : this.state.pauseQOn, travelOn: p.travelOn != null ? p.travelOn : this.state.travelOn, manual: p.manual != null ? p.manual : this.state.manual, remindMinutes: p.remindMinutes != null ? p.remindMinutes : this.state.remindMinutes, soundOn: p.soundOn != null ? p.soundOn : this.state.soundOn,
      playing: false, activePreset: i }, () => { if (p.mode === 'scroll') this._lineSig = null; this.saveSettings(); if (this.state.remindMinutes >= 0) this.scheduleReminder(this.state.remindMinutes); });
  }
}
</script>
